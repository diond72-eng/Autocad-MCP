name: Professional CAD regression
on:
  push:
    paths: ['professional_cad/**', 'tests/test_professional_cad.py', 'pyproject.toml', 'uv.lock', 'examples/professional-cad/**']
  pull_request:
    paths: ['professional_cad/**', 'tests/test_professional_cad.py', 'pyproject.toml', 'uv.lock', 'examples/professional-cad/**']
permissions:
  contents: read
jobs:
  offline-cad:
    runs-on: ubuntu-latest
    env:
      XDG_CACHE_HOME: /tmp/professional-cad-fonts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.9'
          python-version: '3.12'
      - run: uv sync --locked --extra professional
      - run: uv run --no-sync pytest -q tests/test_professional_cad.py
